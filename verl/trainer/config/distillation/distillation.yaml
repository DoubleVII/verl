# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.DistillationConfig

defaults:
  - _self_

# Whether to enable on-policy distillation.
enabled: false

# Teacher logits provider. ref_policy reuses actor_rollout_ref.ref in the same Ray cluster.
teacher:
  _target_: verl.workers.config.DistillationTeacherConfig
  source: ref_policy
  ref_model_path: null
  prompt_source: actor_prompt
  teacher_prompt_path: extra_info.teacher_prompt
  # Temperature used only when computing teacher logits/log probabilities for OPD.
  # This is not a rollout sampling temperature; keep it > 0 even when rollout temperature is 0.
  temperature: 1.0
  # Optional max length for teacher prompts. Defaults to data.max_prompt_length when null.
  max_prompt_length: null
  # When reward-model teacher prompts exceed max_prompt_length, truncate the constructed
  # assistant response segment first, preserving the reward prompt and final instruction.
  response_truncation: middle
  prompt_constructor_path: null
  prompt_constructor_name: null
  prompt_constructor_kwargs: {}

# Distillation loss config.
distillation_loss:
  _target_: verl.workers.config.DistillationLossConfig
  loss_mode: k3
  topk: 32
  use_task_rewards: true
  distillation_loss_coef: 1.0
  loss_max_clamp: null
  log_prob_min_clamp: null
  use_policy_gradient: false
  policy_loss_mode: vanilla
  clip_ratio: 0.2
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  topk_kl_mode: forward
  norm_to_one_for_kl: false
  use_chunked_topk: true
  chunked_topk_chunk_size: 4096
